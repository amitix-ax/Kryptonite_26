# Conda environment for the iceberg drift physics engine. This is an
# alternative to `pip install -e .` / requirements.txt -- useful because
# rasterio/geopandas/shapely's GDAL/GEOS system dependencies are often
# easier to get right via conda-forge than via pip wheels on some platforms.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate iceberg-model
#   pip install -e . --no-deps   # register the package itself
name: iceberg-model
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - xarray>=2023.12
  - rasterio>=1.3
  - pyproj>=3.6
  - shapely>=2.0
  - geopandas>=0.14
  - pydantic>=2.5
  - matplotlib>=3.8
  - pyyaml>=6.0
  - pytest>=7.4
  - netcdf4>=1.6
  - h5py>=3.10
  - pip
  - pip:
      - cdsapi>=0.7
      - earthaccess>=0.10
      - copernicusmarine>=1.3
      - python-dotenv>=1.0
